name: CI/CD

on:
  workflow_dispatch:
   inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'
  # Runs only when an input to the build, the tests or the e2e demo changes, so a push that changes only docs, the
  # site (web/), markdown or another workflow doesn't build or start a Production deploy. Add new build inputs here.
  push:
    branches: [ main, feat/** ]
    paths:
      - 'Chatter.IntegrationEventRelay.*/**'
      - '*.sln'
      - '*.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'global.json'
      - '[Nn]u[Gg]et.[Cc]onfig'
      - '.editorconfig'
      - '.gitattributes'
      - '.scripts/**'
      - '.devops/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/cicd.yml'
  # No path filter: build, cdc integration and e2e are required checks on main, and a required check whose workflow a
  # path filter skips stays Pending and blocks the merge.
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  dotnet-version: '10.0.x'

# Read-only token for every job; deploy grants itself id-token: write for trusted publishing
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.dotnet-version }}
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    # SQL Server integration tests need Docker and run in the cdc-integration job
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration"
    - name: Publish
      run: |
        dotnet publish Chatter.IntegrationEventRelay.Core/src/Chatter.IntegrationEventRelay.Core.csproj -c Release -o publish/source
        dotnet publish Chatter.IntegrationEventRelay.ServiceBroker/src/Chatter.IntegrationEventRelay.ServiceBroker.csproj -c Release -o publish/source
        dotnet publish Chatter.IntegrationEventRelay.Cdc/src/Chatter.IntegrationEventRelay.Cdc.csproj -c Release -o publish/source
    - name: Create nupkg
      run: |
        dotnet pack Chatter.IntegrationEventRelay.Core/src/Chatter.IntegrationEventRelay.Core.csproj -c Release -o publish/nuget
        dotnet pack Chatter.IntegrationEventRelay.ServiceBroker/src/Chatter.IntegrationEventRelay.ServiceBroker.csproj -c Release -o publish/nuget
        dotnet pack Chatter.IntegrationEventRelay.Cdc/src/Chatter.IntegrationEventRelay.Cdc.csproj -c Release -o publish/nuget
    - name: Upload Source
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: source
        path: publish/source/**
        retention-days: 5
        if-no-files-found: error
    - name: Upload NuGet
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nuget
        path: publish/nuget/**
        retention-days: 5
        if-no-files-found: error

  cdc-integration:
    name: cdc integration (SQL Server 2022 + CDC + Service Broker)
    runs-on: ubuntu-latest
    # The tests, switch-over tests between Service Broker and CDC included, take about 21 minutes locally
    timeout-minutes: 45
    # Validates changes before merge; not re-run for the merge to main
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.dotnet-version }}
    - name: Test
      run: dotnet test Chatter.IntegrationEventRelay.Cdc/tests/Chatter.IntegrationEventRelay.Cdc.Tests.csproj --configuration Release --verbosity normal --filter "Category=Integration"

  e2e:
    name: e2e (docker compose + Service Bus emulator)
    runs-on: ubuntu-latest
    # Backstop for a hung startup; e2e.sh itself waits at most 10 minutes for events
    timeout-minutes: 20
    # Validates changes before merge; not re-run for the merge to main
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Run demo end to end
      run: ./.devops/e2e.sh
    - name: Collect container logs
      if: always()
      run: docker compose logs --no-color --timestamps > e2e-logs.txt 2>&1 || true
    - name: Upload container logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: e2e-logs
        path: e2e-logs.txt
        retention-days: 5
    - name: Tear down
      if: always()
      run: docker compose down -v

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deploy at a time, never cancelled mid-push. GitHub keeps only the newest pending run in a group, so a
    # waiting deploy is replaced by a later push to main. Accepted: main is cumulative and the newest deploy
    # publishes it, merges are rare and each deploy waits for approval; a version carried only by a replaced
    # commit is not published.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: Production

    # NuGet trusted publishing: id-token lets NuGet/login exchange the job's OIDC token for a short-lived API key
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.dotnet-version }}

      - name: Download NuGet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget
          path: ./dist/nuget

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: ./dist

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: brenpike

      # --skip-duplicate: merges that don't bump the package version (tests, samples, scripts, CI) must not fail the deploy
      - name: Push Nuget packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
